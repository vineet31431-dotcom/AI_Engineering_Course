[project]
name = "Ai-resume-analyzer"
version = "0.1.0"
description = "AI-powered resume analysis and job requirement matching"
readme = "README.md"
authors = [
    { name = "vineet31431", email = "vineet31431@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "pypdf>=7.0.0",
    ]

[project.scripts]
mini-project = "mini_project:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
